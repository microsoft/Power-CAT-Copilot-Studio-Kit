name: Code apps

on:
  pull_request:
    paths:
      - "code-apps/**"
      - ".github/workflows/code-apps.yml"
  push:
    branches:
      - main
    paths:
      - "code-apps/**"
      - ".github/workflows/code-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.app }} on Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - makers
          - admin
        # 22.13.0 is the minimum version in the README files of the apps.
        # 26 is the current LTS version.
        node:
          - "22.13.0"
          - "26"
    defaults:
      run:
        working-directory: code-apps/${{ matrix.app }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: code-apps/${{ matrix.app }}/package-lock.json

      - name: Install the packages
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Make sure that the checks did not change or add files
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "::error::The checks changed or added files:"
            echo "$changes"
            exit 1
          fi

  source-checks:
    name: Line ends and Agent Library copies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A CRLF file in the repository shows as a change on all of its lines,
      # and it can change the build output (for example, the size of an SVG image).
      - name: Make sure that the text files in code-apps have LF line ends
        run: |
          crlf="$(git ls-files --eol -- code-apps | grep -E '^i/(crlf|mixed)[[:space:]]' || true)"
          if [ -n "$crlf" ]; then
            echo "::error::These files have CRLF line ends in the repository. Change their line ends to LF and commit them again. See CONTRIBUTING.md."
            echo "$crlf"
            exit 1
          fi

      - name: Compare the 2 Agent Library copies
        run: |
          if ! diff -r code-apps/makers/src/features/agent-library/library code-apps/admin/src/features/agent-library/library; then
            echo "::error::The 2 copies of the Agent Library are different. Make the same change in both copies."
            exit 1
          fi
