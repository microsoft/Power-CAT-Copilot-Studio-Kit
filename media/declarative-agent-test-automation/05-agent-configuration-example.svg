<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
  <title id="title">Illustrative ZAVA Agent Configuration</title>
  <desc id="description">A conceptual field layout using fictional values, not a product screenshot or saved record. Configuration Type is Test Automation and User Authentication is Microsoft Authentication. The app-registration Client ID is different from the agent ID. The Environment Id starts with Default followed by the example Tenant ID.</desc>
  <rect width="1440" height="1040" fill="#f5f5f5"/>
  <rect x="1" y="1" width="1438" height="1038" rx="20" fill="none" stroke="#d1d1d1" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="32" width="482" height="34" rx="17" fill="#eee7f8"/>
    <text x="58" y="55" font-size="16" font-weight="600" fill="#4a2d83">ILLUSTRATION ONLY | ALL IDENTIFIERS ARE FICTIONAL</text>
    <text x="40" y="112" font-size="34" font-weight="600" fill="#242424">Example Agent Configuration</text>
    <text x="40" y="146" font-size="20" fill="#424242">Connection fields for ZAVA HR Test Demo</text>
    <rect x="40" y="184" width="1360" height="270" rx="12" fill="#ffffff" stroke="#d1d1d1"/>
    <text x="68" y="228" font-size="24" font-weight="600" fill="#242424">Base Configuration</text>
    <text x="68" y="278" font-size="19" font-weight="600" fill="#424242">Name</text>
    <rect x="68" y="292" width="1304" height="56" rx="6" fill="#fafafa" stroke="#b3b3b3"/>
    <text x="88" y="327" font-size="22" fill="#242424">ZAVA HR Test Demo - Microsoft Authentication</text>
    <text x="68" y="388" font-size="19" font-weight="600" fill="#424242">Configuration Type(s)</text>
    <rect x="306" y="362" width="204" height="42" rx="21" fill="#eee7f8"/>
    <text x="330" y="389" font-size="19" font-weight="600" fill="#4a2d83">Test Automation</text>
    <rect x="40" y="482" width="1360" height="446" rx="12" fill="#ffffff" stroke="#d1d1d1"/>
    <text x="68" y="526" font-size="24" font-weight="600" fill="#242424">User Authentication</text>
    <text x="68" y="574" font-size="19" font-weight="600" fill="#424242">User Authentication</text>
    <rect x="68" y="588" width="1304" height="56" rx="6" fill="#fafafa" stroke="#b3b3b3"/>
    <text x="88" y="623" font-size="22" fill="#242424">Microsoft Authentication</text>
    <text x="68" y="694" font-size="19" font-weight="600" fill="#424242">Agent Schema Name</text>
    <text x="744" y="694" font-size="19" font-weight="600" fill="#424242">Environment Id</text>
    <rect x="68" y="708" width="628" height="56" rx="6" fill="#faf7ff" stroke="#5b3fa5" stroke-width="2"/>
    <rect x="744" y="708" width="628" height="56" rx="6" fill="#faf7ff" stroke="#5b3fa5" stroke-width="2"/>
    <text x="88" y="743" font-family="Consolas, Courier New, monospace" font-size="20" fill="#242424">11111111-2222-4333-8444-555555555555</text>
    <text x="764" y="743" font-family="Consolas, Courier New, monospace" font-size="20" fill="#242424">Default-aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee</text>
    <text x="68" y="814" font-size="19" font-weight="600" fill="#424242">Client ID</text>
    <text x="744" y="814" font-size="19" font-weight="600" fill="#424242">Tenant ID</text>
    <rect x="68" y="828" width="628" height="56" rx="6" fill="#fafafa" stroke="#b3b3b3"/>
    <rect x="744" y="828" width="628" height="56" rx="6" fill="#fafafa" stroke="#b3b3b3"/>
    <text x="88" y="863" font-family="Consolas, Courier New, monospace" font-size="20" fill="#242424">99999999-8888-4777-8666-555555555555</text>
    <text x="764" y="863" font-family="Consolas, Courier New, monospace" font-size="20" fill="#242424">aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee</text>
    <text x="40" y="974" font-size="19" fill="#424242">Replace all example identifiers with your connection values before saving.</text>
    <text x="40" y="1006" font-size="18" fill="#616161">Conceptual field layout, not a product screenshot or evidence of a saved record.</text>
  </g>
</svg>
