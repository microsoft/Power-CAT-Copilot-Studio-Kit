[project]
name = "mcp-shared"
version = "0.5.0"
description = "Shared auth, http, logging, and telemetry utilities for LOB MCP Copilots"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.26.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.1.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_mcp"]
