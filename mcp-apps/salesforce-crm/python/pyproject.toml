[project]
name = "sf-mcp-copilot"
version = "0.5.0"
description = "Ask - Salesforce — MCP server + widget for M365 Copilot"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.26.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.29",
    "starlette>=0.37",
    "structlog>=24.1.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.3.0",
    "cachetools>=5.3.0",
]

[project.scripts]
sf-mcp-copilot = "sf_crm_mcp.salesforce_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sf_crm_mcp"]
